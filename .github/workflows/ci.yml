# Checks for every PR and for main, and the dev deploy once main moves.
#
# The check jobs hold no AWS credentials: this is a public repository, so
# anything a fork can trigger must be safe to run on hostile code. Only
# deploy-dev widens its permissions, and nothing but a push to main -- a
# reviewed merge -- can reach it. Prod deploys live in deploy-prod.yml behind
# an environment approval.
#
# Every step defers to the Makefile, so CI failures reproduce locally with the
# same command.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # New pushes supersede a PR's running checks; a main run is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12' # matches the Lambda runtime
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            infra/requirements.txt
      # Node because `make synth` drives the CDK CLI, and because the infra
      # tests skip themselves without it -- with it, they actually run.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22' # matches .prototools
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: pip install -e "backend[dev,api]" ruff -r infra/requirements.txt
      - run: npm ci
        working-directory: infra
      # VENV points make at setup-python's bin instead of ~/.venvs/meditation.
      - run: make lint test synth VENV="$(dirname "$(which python)")"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make fe-check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      # Cheap on a cache hit: the browser download is skipped and only the
      # apt-installed libraries are (re)confirmed.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  deploy-dev:
    # A push to main is the only way here: PRs (fork or not) never reach this
    # job, so neither do the OIDC permissions below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    # Binds the OIDC sub to environment:dev, which is what the deploy role's
    # trust policy pins on.
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false # queue deploys, never interrupt one
    permissions:
      contents: read
      id-token: write # the OIDC exchange, nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            infra/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            frontend/package-lock.json
      - run: pip install -e "backend[dev,api]" ruff -r infra/requirements.txt
      - run: npm ci
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-meditation-dev-deploy
          aws-region: ap-southeast-2

      # File, not inline PEM: `npm run` flattens multi-line arguments to their
      # first line (2bdea82). The Makefile's signing-key guard and shared CDK
      # context then see the file they expect -- diff included, so the diff
      # never shows the key group being torn down as noise.
      - name: Materialise the signing public key
        env:
          PEM: ${{ vars.AUDIO_PUBLIC_KEY_PEM }}
        run: printf '%s\n' "$PEM" > cf-signing.pub.pem

      # The IAM review CI cannot prompt for lands in this step's log instead.
      - name: Record the diff
        run: make diff ENV=dev VENV="$(dirname "$(which python)")"

      - name: Deploy every dev stack
        run: make deploy ENV=dev APPROVAL=never VENV="$(dirname "$(which python)")"

      - name: Frontend env from stack outputs
        run: |
          python - <<'PY'
          import json, os, pathlib
          flat = {k: v for o in json.load(open("cdk-outputs.json")).values() for k, v in o.items()}
          pathlib.Path("frontend/.env.production").write_text("".join(
              f"{name}={flat[key]}\n" for name, key in [
                  ("VITE_API_URL", "ApiUrl"),
                  ("VITE_COGNITO_USER_POOL_ID", "UserPoolId"),
                  ("VITE_COGNITO_CLIENT_ID", "UserPoolClientId"),
                  ("VITE_AUDIO_DOMAIN", "AudioDomainName"),
                  ("VITE_JOB_TIMEOUT_MS", "JobTimeoutMs"),
              ]))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SITE_BUCKET={flat['SiteBucketName']}\n")
              env.write(f"SITE_DISTRIBUTION_ID={flat['SiteDistributionId']}\n")
              env.write(f"API_URL={flat['ApiUrl']}\n")
          PY

      - name: Build and publish the PWA
        run: |
          cd frontend && npm ci && npm run build && cd ..
          aws s3 sync frontend/dist "s3://$SITE_BUCKET" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$SITE_DISTRIBUTION_ID" --paths '/*'

      - name: Smoke
        run: curl -fsS "$API_URL/health"
