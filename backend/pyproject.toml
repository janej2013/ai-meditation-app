[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meditation-shared"
version = "0.1.0"
description = "Shared models and data access for the AI Meditation App (packaged as a Lambda layer)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Runtime deps of the API container image only. Step-function Lambdas and the
# Cognito trigger deliberately do not pull these in.
api = [
    "fastapi>=0.115",
    "mangum>=0.17",
    # API-only on purpose: shared/ never imports stripe, so the step Lambdas'
    # layer stays vendor-free and db.py takes plain data (constraint 1).
    "stripe>=11,<13",
    # CloudFront signed URLs; botocore has the signer, not the crypto.
    "cryptography>=42",
]
# Runtime deps of the companion agent's container image only (agent_runner/).
# uvicorn because the Lambda Web Adapter needs a real HTTP server, PyJWT
# because a Function URL has no JWT authorizer in front of it.
agent-runner = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.9,<3",
]
# The second engine (agent/langgraph/, milestone L1). Optional: the native
# engine is the default and complete without it. Installed into the agent
# image and into CI's test environment, never into the shared layer.
agent-langgraph = [
    "langchain-core>=0.3,<0.4",
    "langchain-aws>=0.2,<0.3",
    "langgraph>=0.6,<0.7",
]
dev = [
    "pytest>=8.0",
    # tests/agent_runner signs its own ID tokens.
    "PyJWT[crypto]>=2.9,<3",
    "moto[dynamodb]>=5.0",
    # boto3 clients are generated at runtime, so editors and type checkers only
    # see through to transact_write_items/exceptions with these stubs installed.
    "boto3-stubs[dynamodb,polly,s3,stepfunctions]>=1.34",
    # Required by fastapi.testclient.
    "httpx>=0.27",
]

[tool.setuptools]
# `api` and `functions.*` are listed so tests can import them the same way the
# container images do. Only `shared` ships to the step Lambdas.
packages = [
    "shared",
    "shared.tts",
    "agent",
    "agent.tools",
    "agent.native",
    "agent.native.llm",
    "agent.langgraph",
    "agent_runner",
    "api",
    "api.routers",
    "functions",
    "functions.init_user",
    "functions.freeze_credit",
    "functions.generate_script",
    "functions.synthesize",
    "functions.mix_audio",
    "functions.commit_credit",
    "functions.rollback_credit",
]
